name: gitlab-source-group/build
true:
  push: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: echo "Building the application..."
'on':
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
